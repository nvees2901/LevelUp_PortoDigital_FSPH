name: Deploy backend to Cloud Run

on:
  push:
    branches: [ main, firebase-hosting ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ secrets.GCP_PROJECT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          docker build -t us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT }}/fsph-backend/fsph-backend:${{ github.sha }} backend

      - name: Push image to Artifact Registry
        run: |
          docker push us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT }}/fsph-backend/fsph-backend:${{ github.sha }}

      - name: Deploy to Cloud Run
        env:
          IMAGE: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT }}/fsph-backend/fsph-backend:${{ github.sha }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          gcloud run deploy ${{ secrets.CLOUD_RUN_SERVICE }} \
            --image "$IMAGE" \
            --platform managed \
            --region ${{ secrets.CLOUD_RUN_REGION }} \
            --allow-unauthenticated \
            --port 8000 \
            --add-cloudsql-instances ${{ secrets.GCP_PROJECT }}:${{ secrets.CLOUD_RUN_REGION }}:fsph-db-pg \
            --set-env-vars "ENVIRONMENT=production" \
            --set-env-vars "DATABASE_URL=${DATABASE_URL}" \
            --set-env-vars "SECRET_KEY=${SECRET_KEY}" \
            --set-env-vars "GCS_BUCKET=${GCS_BUCKET}" \
            --set-env-vars "GEMINI_API_KEY=${GEMINI_API_KEY}"

      - name: (optional) Run migrations (see DEPLOY_BACKEND.md)
        run: echo "If you want automated migrations, enable Cloud Run jobs or run alembic manually in a one-off job."
