name: Deploy Frontend to Firebase Hosting

on:
  push:
    branches: [ main, firebase-hosting ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: frontend
        run: |
          npm ci

      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: https://fsph-backend-lagyelyfmq-uc.a.run.app/api/v1
        run: |
          npm run build

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          npm install -g firebase-tools
          firebase use --add fsph-colic || true
          firebase deploy --only hosting --project fsph-colic --token "$FIREBASE_TOKEN"
